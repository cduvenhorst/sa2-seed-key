name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - name: Test with Thread Sanitizer
        run: swift test --sanitize=thread

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
